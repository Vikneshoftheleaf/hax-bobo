name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LIVE_MODEL: gemini-3.1-flash-live-preview
      VOICE: Puck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build site with Vite
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}

      - name: Ensure Cloudflare Pages Project Exists
        run: |
          npx wrangler pages project create talking-bobo --production-branch=main || echo "Pages project already exists or ready"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Gemini API Key in Cloudflare Pages
        run: |
          echo "${{ env.GEMINI_API_KEY }}" | npx wrangler pages secret put GEMINI_API_KEY --project-name=talking-bobo || echo "Secret set or already configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=talking-bobo --branch=${{ github.ref_name }} --commit-dirty=true
        env:
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}

      - name: Print Deployment Status
        run: |
          echo "### 🚀 Cloudflare Pages Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "Your Talking Bobo application has been deployed to Cloudflare Pages." >> $GITHUB_STEP_SUMMARY
